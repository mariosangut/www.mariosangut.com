name: CI/CD Portfolioo
on:
  push:
    branches:
      - main # Solo despliega cuando envías código a la rama principal
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'vps/**'
env:
  REGISTRY: ghcr.io
  # Transforma automáticamente "TuUsuario/TuRepo" a minúsculas, requisito estricto de Docker
  IMAGE_NAME: ${{ github.repository }} 
jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso crucial para subir la imagen a tu cuenta

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub, no tienes que crearlo
       
      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_LC }}:latest
            ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ env.SHORT_SHA }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar archivos
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_PUBLIC }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_KEY }}
          source: "vps/*"
          target: "/opt/docker/nginx/"
          strip_components: 1

      - name: Verify vps files exist
        run: |
          test -d vps
          test -n "$(ls -A vps)"

          
      - name: Conexión SSH y Despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP_PUBLIC }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USER }}" --password-stdin

            cd /opt/docker/nginx/
            ./script.sh