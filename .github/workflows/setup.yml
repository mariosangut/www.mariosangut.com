name: CI/CD Portfolio
on:
  push:
    branches:
      - main # Solo despliega cuando envías código a la rama principal
env:
  REGISTRY: ghcr.io
  # Transforma automáticamente "TuUsuario/TuRepo" a minúsculas, requisito estricto de Docker
  IMAGE_NAME: ${{ github.repository }} 
jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso crucial para subir la imagen a tu cuenta

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub, no tienes que crearlo

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Conexión SSH y Despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP_PUBLIC }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /opt/docker/nginx/
            ./script.sh