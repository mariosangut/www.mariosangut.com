name: CI/CD Portfolio

on:
  push:
    branches:
      - main # Solo despliega cuando envías código a la rama principal

env:
  REGISTRY: ghcr.io
  # Transforma automáticamente "TuUsuario/TuRepo" a minúsculas, requisito estricto de Docker
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso crucial para subir la imagen a tu cuenta

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub, no tienes que crearlo

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push # Obliga a esperar a que la imagen esté subida
    runs-on: ubuntu-latest
    steps:
      - name: Setup Dedicated WireGuard Tunnel
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard
          
          echo "
          [Interface]
          PrivateKey = ${{ secrets.VPS_WG_PRIVATEKEY }}
          Address = 10.99.0.2/24
          DNS = 1.1.1.1, 8.8.8.8
          
          [Peer]
          PublicKey = ${{ secrets.VPS_WG_PUBLICKEY }}
          Endpoint = ${{ secrets.VPS_IP_PUBLIC }}:51821
          AllowedIPs = 10.99.0.0/24
          PersistentKeepalive = 25
          " | sudo tee /etc/wireguard/wg0.conf
          
          # Aunque en GitHub se llame wg0 localmente, se conecta a tu wg1 remoto
          sudo wg-quick up wg0
          sleep 2
          
          # Ping de prueba a la IP interna de tu VPS en esta subred
          ping -c 3 10.99.0.1

      - name: Conexión SSH y Despliegue
        env:
          SSH_KEY: ${{ secrets.VPS_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deployment_key
          chmod 600 ~/.ssh/deployment_key
          ssh -i ~/.ssh/deployment_key -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "cd /opt/docker/nginx/ && ./script.sh"